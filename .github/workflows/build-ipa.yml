name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project RAMTest.xcodeproj \
            -scheme RAMTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "RAMTest.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "RAMTest.app not found"
            find build -name "*.app" -o -name "*.ipa"
            exit 1
          fi
          rm -rf Payload RAMTest.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r RAMTest.ipa Payload
          ls -lh RAMTest.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RAMTest.ipa
          path: RAMTest.ipa
